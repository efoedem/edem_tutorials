services:
  - type: web
    name: edem-tutorials
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edem-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.9.0

databases:
  - name: edem-db
    plan: free