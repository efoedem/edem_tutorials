{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0">Payment Instructions</h4>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-info text-center mb-4">
                        <p class="mb-1">Please send <strong>GHS 50.00</strong> via MoMo to:</p>
                        <h3 class="fw-bold">024 123 4567</h3>
                        <p class="small mb-0">Name: Edem Tutorials</p>
                    </div>

                   <form method="POST">
    {% csrf_token %}

    <div class="mb-4">
        <label for="transaction_id" class="form-label fs-5">Enter Transaction ID:</label>
        <input type="text"
               id="transaction_id"
               name="transaction_id"
               class="form-control form-control-lg"
               placeholder="Enter your ID here..."
               required>
    </div>

    <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold shadow-sm" style="background-color: #1a633d; border: none;">
        Confirm & Generate Receipt
    </button>
</form>

                    <div class="text-center mt-3">
                        <a href="{% url 'course_list' %}" class="text-muted small">Cancel and go back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
