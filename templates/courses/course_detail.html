<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.title }} | Edem Tutorials</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="{% url 'course_list' %}">← Back to Courses</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <h1>{{ course.title }}</h1>
                <p class="text-muted">Instructor: {{ course.teacher.username }} | Added on: {{ course.created_at|date }}</p>
                <hr>
                <div class="mt-4">
                    <h5>Description</h5>
                    <p>{{ course.description|linebreaks }}</p>
                </div>
            </div>
            <div class="col-md-4">
                {% if course.thumbnail %}
                    <img src="{{ course.thumbnail.url }}" class="img-fluid rounded shadow-sm mb-3">
                {% endif %}
                <div class="card p-3">
                   <a href="{% url 'enroll_course' course.id %}" class="btn btn-primary">Enroll Now</a>
</a>
</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
